[project]
name = "the-dozens-django"
version = "0.1.0"
description = "Conversion of the Dozens Roast API from Flask RestX to Django DRF framework"
authors = [

    { name = "Terry Brooks" }

]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<3.15"  # matches the only version CI/Codacy/Docker actually build and test against
dependencies = [
    "django>=6.0,<6.1",  # django-prometheus 2.5.0 caps Django at <6.1
    "markdown",
    "djangorestframework",
    "django-filter",
    "loguru",
    "psycopg2-binary",
    "redis[hiredis]",
    "django-mailer",
    "graphene-django",
    "uritemplate",
    "django-crispy-forms",
    "crispy-bootstrap5",
    "gunicorn",
    "django-prometheus",
    "django-redis",
    "drf-spectacular",
    "requests",
    "launchdarkly-server-sdk",
    "launchdarkly-observability",
    "django-configurations",
    "django-cors-headers",
    "django-storages",
    "djoser",
    "drf-spectacular-sidecar",
    "humanize",
    "arrow",
    "whitenoise",
    "boto3",
    "drf-restwind",
    "pygithub",
    "django-jazzmin",
    "loki-logger-handler>=1.1.2,<2.0.0",
]

[dependency-groups]
test = [
    "pytest-django",
    "coverage",
    "pytest-cov",
]
dev = [
    "django-debug-toolbar",
    "black",
    "isort",
    "mypy",
    "pylint",
    "pylint-django",
    "pylint-celery",
    "bandit",
    "django-stubs[compatible-mypy]",
    "kolo",
    "autoflake",
    "ruff",
    "djlint",
    "pre-commit>=4.6.2,<5.0.0",
]

[tool.uv]
# No [build-system] table is declared, so uv already treats this project as
# an unpackaged application (mirrors Poetry's former `package-mode = false`).
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
# pytest_dozens_plugin installs the django-configurations importer via
# pytest_load_initial_conftests(tryfirst=True), which must fire before
# pytest-django's own implementation of that hook accesses Django settings.
# Plugins loaded via addopts -p are registered before any conftest file is
# discovered, making this the only reliable injection point.
# Both plugin modules live in .configs/ (not repo root), so it needs to be on
# sys.path for "-p <name>" to resolve them by bare module name - a path like
# ".configs/pytest_dozens_plugin" is not valid for -p, which imports its
# argument as a module, not a file path.
#
# conftest.py also lives in .configs/ now. Pytest's usual conftest.py
# auto-discovery only walks up from test file locations to rootdir, so a
# conftest.py in a sibling directory (not an ancestor of any test path) is
# never found that way - it's loaded explicitly via -p instead, exactly like
# pytest_dozens_plugin.
pythonpath = [".configs"]
addopts = ["-p", "pytest_dozens_plugin", "-p", "conftest", "--reuse-db"]
testpaths = [
  "applications/API/tests",
  "applications/graphQL/tests",
  "applications/frontend/tests",
  "applications/ld_integration/tests",
  "core/tests",
  "common/tests"


]

[tool.djlint]
format_css=true
format_js=true
ignore="H021,T001,H008,H030,H031,H006"
extend_exclude = "templates/drf_spectacular/*"
[tool.djlint.css]
indent_size=5

[tool.djlint.js]
indent_size=5

[tool.isort]
profile = "black"
skip = [".venv"]
extend_skip_glob = ["*/migrations/*"]

known_first_party = [
    "applications",
    "core",
    "common",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
check_typed_exception = false
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.bandit]
# B101: pytest uses bare `assert` — not a security concern
skips = ["B101"]
# Test fixtures use hardcoded passwords by design; skip scanning them
exclude_dirs = [
    "applications/API/tests",
    "applications/graphQL/tests",
    "applications/frontend/tests",
    "common/tests",
    "core/tests",
]

[tool.coverage.run]
branch = true
source = ["applications", "core", "common"]
omit = [
    "*/tests/*",
   "*/migrations/*",
    "*/wsgi.py",
    "*/asgi.py",
    "core/storage_backends.py",
    "core/apps.py",
    "applications/*/apps.py",
    "applications/API/schema_extensions.py",
    "applications/ld_integration/management/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/wsgi.py",
    "*/asgi.py",
    "core/storage_backends.py",
    "core/apps.py",
    "applications/*/apps.py",
    "applications/API/schema_extensions.py",
    "applications/ld_integration/management/*",
]
exclude_lines = [
  "pragma: no cover",
  "def __str__",
  "if settings.DEBUG",
  "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "cobertura.xml"
