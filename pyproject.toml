[project]
name = "the-dozens-django"
version = "0.1.0"
description = "Conversion of the Dozens Roast API from Flask RestX to Django DRF framework"
authors = [

    { name = "Terry Brooks" }

]
license = "MIT"
readme = "README.md"
package-mode = false
dynamic = ["dependencies"]
requires-python = ">=3.11,<4.0"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
django = "*"
markdown = "*"
djangorestframework = "*"
django-filter = "*"
python-dotenv = "*"
loguru = "*"
logtail-python = "*"
psycopg2-binary = "*"
redis = { extras = ["hiredis"], version = "*" }
django-mailer = "*"
graphene-django = "*"
uritemplate = "*"
django-rest-swagger = "*"
django-crispy-forms = "*"
crispy-bootstrap5 = "*"
django-cacheops = "*"
gunicorn = "*"
django-prometheus = "*"
django-redis = "*"
drf-spectacular = "*"
requests = "*"
django-recaptcha = "*"
launchdarkly-server-sdk = "*"
launchdarkly-observability = "*"
django-configurations = "*"
django-cors-headers = "*"
django-storages = "*"
djoser = "*"
drf-spectacular-sidecar = "*"
drf-extensions = "*"
humanize = "*"
arrow = "*"
whitenoise = "*"
boto3 = "*"
drf-restwind = "*"
pygithub = "*"
django-jazzmin = "*"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest-django = "*"
coverage = "*"
pytest-cov = "*"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "*"
black = "*"
isort = "*"
mypy = "*"
pylint = "*"
pylint-django = "*"
pylint-celery = "*"
bandit = "*"
django-stubs = { version = "*", extras = ["compatible-mypy"] }
pre-commit = "*"
kolo = "*"
autoflake = "*"
ruff = "*"
djlint = "*"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
# pytest_dozens_plugin installs the django-configurations importer via
# pytest_load_initial_conftests(tryfirst=True), which must fire before
# pytest-django's own implementation of that hook accesses Django settings.
# Plugins loaded via addopts -p are registered before any conftest file is
# discovered, making this the only reliable injection point.
addopts = ["-p", "pytest_dozens_plugin"]
testpaths = [
  "applications/API/tests",
  "applications/graphQL/tests",
  "applications/frontend/tests",
  "core/tests",
  "common/tests"

]

[tool.djlint]
format_css=true
format_js=true
ignore="H021,T001,H008,H030,H031,H006"

[tool.djlint.css]
indent_size=5

[tool.djlint.js]
indent_size=5

[tool.isort]
profile = "black"
skip = [".venv", "migrations"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.bandit]
# B101: pytest uses bare `assert` — not a security concern
skips = ["B101"]
# Test fixtures use hardcoded passwords by design; skip scanning them
exclude_dirs = [
    "applications/API/tests",
    "applications/graphQL/tests",
    "applications/frontend/tests",
    "common/tests",
    "core/tests",
]

[tool.coverage.run]
branch = true
source = ["applications", "core", "common"]
omit = [
    "*/tests/*",
   "*/migrations/*",
    "*/wsgi.py",
    "*/asgi.py",
    "core/storage_backends.py",
    "core/apps.py",
    "applications/*/apps.py",
    "applications/API/schema_extensions.py",
    "applications/ld_integration/management/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/wsgi.py",
    "*/asgi.py",
    "core/storage_backends.py",
    "core/apps.py",
    "applications/*/apps.py",
    "applications/API/schema_extensions.py",
    "applications/ld_integration/management/*",
]
exclude_lines = [
  "pragma: no cover",
  "def __str__",
  "if settings.DEBUG",
  "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "cobertura.xml"
