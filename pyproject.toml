[project]
name = "the-dozens-django"
version = "0.1.0"
description = "Conversion of the Dozens Roast API from Flask RestX to Django DRF framework"
authors = [{ name = "Terry Brooks" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "django>=5.2.5,<6.0",
    "markdown>=3.5,<4",
    "djangorestframework>=3.15.2,<4",
    "django-filter>=23.3,<24",
    "python-dotenv>=1.0.0,<2",
    "loguru>=0.7.2,<0.8",
    "django-debug-toolbar>=4.2.0,<5",
    "logtail-python>=0.2.7,<0.3",
    "psycopg2-binary>=2.9.9,<3",
    "redis[hiredis]>=5.0.1,<6",
    "django-mailer>=2.3,<3",
    "graphene-django>=3.1.5,<4",
    "uritemplate>=4.1.1,<5",
    "django-rest-swagger>=2.2.0,<3",
    "django-crispy-forms>=2.1,<3",
    "crispy-bootstrap5>=0.7,<0.8",
    "django-cacheops>=7.0.1,<8",
    "gunicorn>=23.0.0,<24",
    "django-prometheus>=2.3.1,<3",
    "django-redis>=5.4.0,<6",
    "drf-spectacular>=0.26.5,<0.27",
    "requests>=2.32.4",
    "django-recaptcha>=3.0.0,<4",
    "launchdarkly-server-sdk>=9.15.0,<10",
    "launchdarkly-observability>=1.1.0,<2",
    "django-configurations>=2.5.1,<3",
    "django-cors-headers>=4.9.0,<5",
    "django-storages>=1.14.6,<2",
    "djoser>=2.3.3,<3",
    "drf-spectacular-sidecar>=2026.1.1,<2027",
    "drf-extensions>=0.8.0,<0.9",
    "humanize>=4.15.0,<5",
    "arrow>=1.4.0,<2",
    "whitenoise>=6.11.0,<7",
    "boto3>=1.42.54,<2",
    "drf-restwind>=1.3.0,<2",
    "pygithub>=2.9.0,<3",
    "django-jazzmin>=3.0.4,<4",
]

[dependency-groups]
test = [
    "pytest-django>=4.5.2,<5",
    "coverage>=7.0,<8",
    "pytest-cov>=5.0,<6",
]
dev = [
    "black>=26.3.1,<27",
    "pip>=26.0,<27",
    "isort>=5.12.0,<6",
    "mypy>=1.6.1,<2",
    "pylint>=3.0.2,<4",
    "pylint-django>=2.6.1,<3",
    "pylint-celery>=0.3,<0.4",
    "bandit>=1.8,<2",
    "django-stubs[compatible-mypy]>=5.2,<6",
    "pre-commit>=3.5.0,<4",
    "kolo>=3.1.0",
    "autoflake>=2.2.1,<3",
    "ruff>=0.15.2,<0.16",
    "djlint>=1.36.4,<2",
]

[tool.uv]
# Application, not a library: `uv sync` installs dependencies only, never the project itself.
package = false
# `uv sync` installs the dev and test groups too; the production image uses `--no-default-groups`.
default-groups = "all"
required-version = ">=0.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
# pytest_dozens_plugin installs the django-configurations importer via
# pytest_load_initial_conftests(tryfirst=True), which must fire before
# pytest-django's own implementation of that hook accesses Django settings.
# Plugins loaded via addopts -p are registered before any conftest file is
# discovered, making this the only reliable injection point.
addopts = ["-p", "pytest_dozens_plugin"]
testpaths = [
  "applications/API/tests",
  "applications/graphQL/tests",
  "applications/frontend/tests",
  "core/tests",
  "common/tests"

]

[tool.djlint]
format_css=true
format_js=true
ignore="H021,T001,H008,H030,H031,H006"

[tool.djlint.css]
indent_size=5

[tool.djlint.js]
indent_size=5

[tool.isort]
profile = "black"
skip = [".venv", "migrations"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.bandit]
# B101: pytest uses bare `assert` — not a security concern
skips = ["B101"]
# Test fixtures use hardcoded passwords by design; skip scanning them
exclude_dirs = [
    "applications/API/tests",
    "applications/graphQL/tests",
    "applications/frontend/tests",
    "common/tests",
    "core/tests",
]

[tool.coverage.run]
branch = true
source = ["applications", "core", "common"]
omit = [
    "*/tests/*",
   "*/migrations/*",
    "*/wsgi.py",
    "*/asgi.py",
    "core/storage_backends.py",
    "core/apps.py",
    "applications/*/apps.py",
    "applications/API/schema_extensions.py",
    "applications/ld_integration/management/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/wsgi.py",
    "*/asgi.py",
    "core/storage_backends.py",
    "core/apps.py",
    "applications/*/apps.py",
    "applications/API/schema_extensions.py",
    "applications/ld_integration/management/*",
]
exclude_lines = [
  "pragma: no cover",
  "def __str__",
  "if settings.DEBUG",
  "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "cobertura.xml"
