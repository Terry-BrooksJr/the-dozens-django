version: '3'
env:
  LETSENCRYPT_EMAIL: Terry.Arthur@BrooksJr.com
  # CODACY_PROJECT_TOKEN must be set in the environment (do not hardcode)
  CODACY_PROJECT_TOKEN: ${CODACY_PROJECT_TOKEN}
  CODACY_USERNAME: Terry-BrooksJr
  CODACY_PROJECT_NAME: the-dozens-django
  PYTHONPATH: "{{ .TASKFILE_DIR }}"
  TEMP_STATIC_DIR: ${TEMP_STATIC_DIR}
silent: true
vars:
  # Single source-of-truth for lintable code — every lint task references this.
  # Directories are recursed; standalone root-level .py files are listed explicitly.
  PY_SOURCES: applications common core run .deploy .configs
tasks:
  default:
    cmds:
      - task -l

  venv:
    desc: Make a new virtual environment
    cmds:
      - uv venv --prompt="ACTIVE_VENV_DJANGO_DOZENS"
    internal: true

  run:dev:
    desc: Starts the Django Application and background workers in a debug state
    dir: .
    env:
      DJANGO_CONFIGURATION: "Development"

    cmds:
      - echo "Completing Pre-Start Environment Check For Development Run..."
      - echo "Django Configuration:${DJANGO_CONFIGURATION}"
      - echo "Doppler dev:${DOPPLER_PROJECT}"
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/python3 -m gunicorn -w 1 --timeout 120 --worker-class=sync core.wsgi:application --bind 127.0.0.1:{{or .CLI_ARGS 8000}} --reload
    # NOTE: `source .envrc` removed — no-op in a non-interactive subshell.
    # NOTE: `-t 1` (connect timeout) removed — it conflicted with --timeout 120.
    interactive: false
    silent: false

  install:
    desc: Install project dependencies into the virtual environment
    cmds:
      - uv sync --group test --group dev
      # .git/hooks/pre-commit is local-only (never committed), and pre-commit
      # has no auto-discovery for a config outside repo root, so every fresh
      # clone needs this re-run to point the hook at .configs/.
      - .venv/bin/pre-commit install -c .configs/.pre-commit-config.yaml
    silent: false

  freeze:
    desc: Export locked production, development, and test requirements
    cmds:
      - uv lock
      - uv export --no-default-groups --no-hashes --output-file ./requirements/base.txt
      - uv export --only-group dev --no-hashes --output-file ./requirements/dev.txt
      - uv export --only-group test --no-hashes --output-file ./requirements/test.txt
    generates:
      - ./requirements/base.txt
      - ./requirements/dev.txt
      - ./requirements/test.txt
      - ./uv.lock
    sources:
      - ./pyproject.toml
      - ./uv.lock
    silent: false

  db_sync:
    desc: Make and run migrations
    dir: .
    cmds:
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/python3 run/manage.py makemigrations
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/python3 run/manage.py migrate
    # NOTE: sources/generates removed for migrations — Task's file-fingerprinting
    # is unreliable for Django migration files (auto-generated names change each
    # run). Migrations are always re-run to guarantee idempotency.

  send:mail:
    dir: .
    desc: Drain the django-mailer queue and deliver queued emails via SMTP (production)
    env:
      DJANGO_CONFIGURATION: Production
    cmds:
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/python3 run/manage.py send_mail

  collect:
    dir: .
    desc: Collect static files into single directory for production
    env:
      DJANGO_CONFIGURATION: Production
    cmds:
      - PYTHONPATH="${PYTHONPATH}"  ./scripts/with_doppler.sh .venv/bin/python3 run/manage.py collectstatic --no-input
    # NOTE: `source .envrc` removed (no-op in subshell). PYTHONPATH now uses the
    # globally defined env var instead of a long inline literal.

  run:test:
    dir: .
    desc: Run all tests with pytest-cov and generate cobertura.xml (primary CI task)
    env:
      DJANGO_CONFIGURATION: Staging
    cmds:
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/coverage erase
      - >-
        PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/coverage run --rcfile=pyproject.toml -m pytest -v
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/coverage report -m
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/coverage xml -o cobertura.xml
    generates:
      - ".coverage"
      - "cobertura.xml"
  run:prod:
    dir: .
    silent: false
    env:
      DJANGO_CONFIGURATION: "Production"
    desc: Start Production Level Services — install requirements, apply migrations, then start production server
    cmds:
      - echo "Completing Pre-Start Environment Check For Production Run..."
      - echo "Django Configuration:${DJANGO_CONFIGURATION}"
      - echo "Doppler Project:${DOPPLER_PROJECT}"
      - echo "Doppler Env:${DOPPLER_CONFIG}"
      - echo 'Starting Production Level Services...'
      - echo 'Installing dependencies'
      - task: install

      - echo 'Applying migrations...'
      - task: db_sync

      - echo 'Starting server...'
      - ./scripts/with_doppler.sh .venv/bin/python3 -m gunicorn -c .deploy/gunicorn.conf.py --workers=2 --threads=2 core.wsgi:application --bind 0.0.0.0:{{or .CLI_ARGS 8080}}

  schema-check:
    dir: "{{.TASKFILE_DIR}}"
    desc: Check Models and Serializers for schema compliance with OpenAPI 3.0 Standards and fail on warnings
    cmds:
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/python3 run/manage.py spectacular --file schema/schema$(date +"%Y-%m-%d").yaml --validate
    internal: true

  schema:
    deps: [ schema-check ]
    dir: "{{.TASKFILE_DIR}}"
    desc: Generate OpenAPI 3.0 schema.yaml file from models and serializers
    cmds:
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/python3 run/manage.py spectacular --file schema/schema$(date +"%Y-%m-%d_%H:%M:%S").yaml

  build-image:
    desc: Build Docker Image
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 --push -f .deploy/Dockerfile -t terrybrooks/thedozens:latest .
    requires:
      vars:
        - DOPPLER_TOKEN

  lint:lint:
    desc: Run all linting and formatting tools
    dir: .
    cmds:
      - echo "🔍 Running Python linting and formatting..."
      - echo "🧹 Running autoflake (unused imports/variables check)..."
      - .venv/bin/autoflake --check --recursive --remove-all-unused-imports --remove-unused-variables --remove-duplicate-keys --ignore-init-module-imports {{.PY_SOURCES}}
      - echo "📋 Running isort (import sorting)..."
      - .venv/bin/isort {{.PY_SOURCES}} --check-only --diff
      - echo "⚫ Running black (code formatting)..."
      - .venv/bin/black {{.PY_SOURCES}} --check --diff
      - echo "🚀 Running ruff (fast linting)..."
      - .venv/bin/ruff check {{.PY_SOURCES}}
      - echo "🔧 Running pylint (comprehensive linting)..."
      - .venv/bin/pylint $(find {{.PY_SOURCES}} -name '*.py' -not -path '*/migrations/*') --load-plugins=pylint_django,pylint_celery --django-settings-module=core.settings
      - echo "🔒 Running bandit (security linting)..."
      - .venv/bin/bandit -r {{.PY_SOURCES}} -c pyproject.toml
      - echo "🎯 Running mypy (type checking)..."
      # Runs via run/mypy_runner.py to bootstrap django-configurations importer
      # before django-stubs tries to import settings.  Doppler secrets are stubbed
      # because mypy only needs the settings structure, not real values.
      - >-
        SECRET_KEY=x GITHUB_ACCESS_TOKEN=x RECAPTCHA_PRIVATE_KEY=x RECAPTCHA_PUBLIC_KEY=x
        S3_OBJECT_STORAGE_KEY=x S3_OBJECT_STORAGE_SECRET=x S3_OBJECT_STORAGE_BUCKET_NAME=x EMAIL_ACCT_PASSWORD=x
        .venv/bin/python run/mypy_runner.py {{.PY_SOURCES}}
      - echo "🌟 Running djlint (Django template linting)..."
      - .venv/bin/djlint --check templates/**/*.html
      - echo "✅ All linting checks completed!"
    silent: false
    interactive: false

  lint:fix:
    desc: Automatically fix linting and formatting issues, then report what's left
    dir: .
    cmds:
      # ── Phase 1: Auto-fix (order matters — cleanups → lint fixes → formatting) ──
      - echo "🔧 Auto-fixing Python linting and formatting issues..."
      - echo "🧹 Running autoflake (removing unused imports/variables)..."
      - cmd: .venv/bin/autoflake --in-place --recursive --remove-all-unused-imports --remove-unused-variables --remove-duplicate-keys --ignore-init-module-imports {{.PY_SOURCES}}
        ignore_error: true
      - echo "📋 Running isort (sorting imports)..."
      - cmd: .venv/bin/isort {{.PY_SOURCES}}
        ignore_error: true
      - echo "🚀 Running ruff (auto-fix with unsafe fixes)..."
      - cmd: .venv/bin/ruff check {{.PY_SOURCES}} --fix --unsafe-fixes
        ignore_error: true
      - echo "⚫ Running black (code formatting — runs last to reformat all changes)..."
      - cmd: .venv/bin/black {{.PY_SOURCES}}
        ignore_error: true
      - echo "🌟 Running djlint (Django template auto-fix)..."
      - cmd: .venv/bin/djlint --reformat templates/**/*.html
        ignore_error: true
      # ── Phase 2: Verify — run non-fixable linters so you see what's left ──
      - echo ""
      - echo "─────────────────────────────────────────────"
      - echo "🔍 Verifying remaining issues..."
      - echo "─────────────────────────────────────────────"
      - echo "🚀 Ruff..."
      - cmd: .venv/bin/ruff check {{.PY_SOURCES}}
        ignore_error: true
      - echo "🔧 Pylint..."
      - cmd: .venv/bin/pylint $(find {{.PY_SOURCES}} -name '*.py' -not -path '*/migrations/*') --load-plugins=pylint_django,pylint_celery --django-settings-module=core.settings
        ignore_error: true
      - echo "🔒 Bandit..."
      - cmd: .venv/bin/bandit -r {{.PY_SOURCES}} -c pyproject.toml
        ignore_error: true
      - echo "🎯 Mypy..."
      - cmd: >-
          SECRET_KEY=x GITHUB_ACCESS_TOKEN=x RECAPTCHA_PRIVATE_KEY=x RECAPTCHA_PUBLIC_KEY=x
          S3_OBJECT_STORAGE_KEY=x S3_OBJECT_STORAGE_SECRET=x S3_OBJECT_STORAGE_BUCKET_NAME=x EMAIL_ACCT_PASSWORD=x
          .venv/bin/python run/mypy_runner.py {{.PY_SOURCES}}
        ignore_error: true
      - echo ""
      - echo "✅ Auto-fix completed! Review any remaining issues above."
    silent: false
    interactive: false

  django:
    desc: "Wrapper command to simplify the use of Django management commands. Example Usage: task django -- runserver"
    dir: "{{.TASKFILE_DIR}}"
    env:
      PYTHONPATH: "{{.PYTHONPATH}}"
    cmds:
      - PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/python3 run/manage.py {{.CLI_ARGS}}
    silent: false
    interactive: true

  test:coverage:
    desc: Run all tests with pytest-cov; generates term, XML, and HTML reports
    env:
      DJANGO_CONFIGURATION: Staging
    cmds:
      - echo "Completing Pre-Start Environment Check For Testing with Coverage Upload..."
      - echo "Django Configuration:${DJANGO_CONFIGURATION}"
      - echo "Doppler Project:${DOPPLER_PROJECT}"
      - echo "Doppler Env:${DOPPLER_CONFIG}"
      - >-
        PYTHONPATH="${PYTHONPATH}" ./scripts/with_doppler.sh .venv/bin/pytest --cov --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml:cobertura.xml --cov-report=html:htmlcov --no-cov-on-fail -v --exitfirst
    # source= and omit= are defined once in [tool.coverage.run] in pyproject.toml;
    # --cov (without an argument) honours that config rather than duplicating it here.
    silent: false
    sources:
      - "**/*.py"
    generates:
      - ".coverage"
      - "cobertura.xml"
      - "htmlcov/index.html"

  coverage:upload:
    desc: Upload coverage report to Codacy (requires CODACY_PROJECT_TOKEN env var)
    # run:test uses `coverage run --rcfile=pyproject.toml` + `coverage xml -o cobertura.xml`,
    # so the cobertura.xml it produces is governed by the same [tool.coverage.*] config as
    # test:coverage.  Depending on run:test (the leaner CI task) is intentional.
    deps: [ run:test ]
    env:
      DJANGO_CONFIGURATION: "Staging"
    cmds:
      - bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r cobertura.xml
    requires:
      vars:
        - CODACY_PROJECT_TOKEN

  deps:upgrade:
    desc: Resolve dependencies to the newest mutually compatible versions
    cmds:
      - uv lock --upgrade
      - uv tree --outdated
    silent: false
