openapi: 3.0.3
info:
  title: Yo' Momma - The Joke API
  version: 2.0.0
  termsOfService: https://dozens.s3.us-east-005.backblazeb2.com/TERMS_OF_SERVICE.md
  contact:
    name: Terry A. Brooks, Jr.
    email: api@yo-momma.io
    url: https://brooksjr.dev
paths:
  /api/health/:
    get:
      operationId: service_heartbeat
      description: |-
        Checks the service's dependencies. Responds `503` with `status: degraded` when the database, GraphQL or (if enabled) LaunchDarkly is unhealthy, otherwise `200`.

        `loki` reports log forwarding for the worker that answered: `Actively Forwarded` (configured and the latest push succeeded), `Configured - Not Forwarding` (configured but nothing delivered yet, or the latest push failed) or `Disabled` (not configured). It is informational and never makes the service degraded.

        Never cached and not rate limited.
      summary: Service health heartbeat
      tags:
      - Health & Status Check
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                Healthy:
                  value:
                    status: ok
                    database: ok
                    graphql: ok
                    launchdarkly: ok
                    loki: Actively Forwarded
                    timestamp: '2026-10-16T10:04:41.581040+00:00'
          description: All checks healthy.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                Degraded:
                  value:
                    status: degraded
                    database: unavailable
                    graphql: ok
                    launchdarkly: not_initialized
                    loki: Configured - Not Forwarding
                    timestamp: '2026-10-16T10:04:41.581040+00:00'
          description: One or more checks degraded.
  /api/ping/:
    get:
      operationId: ping
      description: 'Returns `{"status": "ok"}` whenever the server can answer requests.
        It checks nothing else; use `GET /api/health/` for dependency checks. Never
        cached and not rate limited.'
      summary: Liveness probe
      tags:
      - Health & Status Check
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
              examples:
                Alive:
                  value:
                    status: ok
          description: The server is up.
  /api/schema/:
    get:
      operationId: openapi_schema
      description: 'This API''s OpenAPI 3 description: YAML by default, JSON with
        `?format=json`. Browse it at `/api/swagger/` or `/api/redoc/`.'
      summary: Download the OpenAPI schema
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
