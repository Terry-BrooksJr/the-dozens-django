  /api/v2.0.0/categories/:
    get:
      operationId: list_categories
      description: Every public category, grouped by theme and keyed by category key,
        with its name, description and number of active insults. Use either the key
        or the name wherever the API takes a category.
      summary: List categories by theme
      tags:
      - Insult Categories
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Categories:
                  value:
                    help_text: 'Here is a list of all available Insult Categories.
                      The API will accept either values and is case insensitive. Ex:
                      `/api/insults/p` and `api/insults/POOR` will yield the same
                      result'
                    results:
                      Yo Momma:
                        theme_description: Classic yo momma jokes.
                        categories:
                          F:
                            name: Fat
                            description: ''
                            count: 80
                          P:
                            name: Poor
                            description: ''
                            count: 134
          description: Categories grouped by theme.
        '429':
          description: API rate limit exceeded
        '500':
          description: Internal server error occurred
  /api/v2.0.0/categories/{category_name}/insults/:
    get:
      operationId: list_insults_by_category
      description: A page of insults in one category, in random order. Anonymous callers
        see active insults; an authenticated caller also sees their own submissions
        in the category, whatever their status. The page also carries `total_count`
        and `timestamp`.
      summary: List insults in a category
      parameters:
      - in: path
        name: category_name
        schema:
          type: string
        description: Category key (e.g. `P`) or name (e.g. `Poor`); case-insensitive.
        required: true
      - in: query
        name: nsfw
        schema:
          type: boolean
        description: 'Filter explicit content: `true` returns only NSFW insults, `false`
          only SFW ones. Omit it to include both.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Insults
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOptimizedInsultList'
              examples:
                MyInsultsListExample:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - - reference_id: GIGGLE_Nzk1
                        category: One-Off/Unique
                        content: Yo momma is so bald... you can see what''s on her
                          mind.
                        status: Active
                        reports_count: 0
                      - reference_id: CACKLE_Xy12
                        category: Stupid
                        content: Yo momma so stupid, she went to the dentist to get
                          Bluetooth.
                        status: Pending
                        reports_count: 2
                  summary: List of User's Insults
                  description: Shows a simplified list of insults created by the user
                PageOfInsults:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - content: Yo momma is so fat she needs two time zones.
                        reference_id: SNORT_MQ==
                        category: Fat
                        nsfw: false
                        status: A
                        added: 2 days ago
                        by: Mike R.
                      total_count: 1
                      timestamp: '2026-10-16T10:04:39.652156+00:00'
                  summary: Page of insults
          description: A page of insults.
        '400':
          description: Unknown category key or name.
        '404':
          description: '`page` is past the last page (filters that match nothing return
            `200` with no results).'
        '500':
          description: Internal server error occurred
        '429':
          description: API rate limit exceeded
  /api/v2.0.0/insults/:
    get:
      operationId: list_insults
      description: A page of insults in random order, optionally filtered by `category`
        and `nsfw`. Anonymous callers see active insults; an authenticated caller
        also sees all of their own submissions. The page also carries `total_count`
        and `timestamp`.
      summary: List insults
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category key (e.g. `P`) or name (e.g. `Poor`), case-insensitive.
          An unknown category returns `400`.
      - in: path
        name: category_name
        schema:
          type: string
        description: Category key (e.g. `P`) or name (e.g. `Poor`); case-insensitive.
        required: true
      - in: query
        name: nsfw
        schema:
          type: boolean
        description: 'Filter explicit content: `true` returns only NSFW insults, `false`
          only SFW ones. Omit it to include both.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Insults
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOptimizedInsultList'
              examples:
                MyInsultsListExample:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - - reference_id: GIGGLE_Nzk1
                        category: One-Off/Unique
                        content: Yo momma is so bald... you can see what''s on her
                          mind.
                        status: Active
                        reports_count: 0
                      - reference_id: CACKLE_Xy12
                        category: Stupid
                        content: Yo momma so stupid, she went to the dentist to get
                          Bluetooth.
                        status: Pending
                        reports_count: 2
                  summary: List of User's Insults
                  description: Shows a simplified list of insults created by the user
                PageOfInsults:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 2
                      next: null
                      previous: null
                      results:
                      - content: Yo momma is so fat she needs two time zones.
                        reference_id: SNORT_MQ==
                        category: Fat
                        nsfw: false
                        status: A
                        added: 2 days ago
                        by: Mike R.
                      - content: Yo momma is so poor she can't even pay attention.
                        reference_id: GIGGLE_Mg==
                        category: Poor
                        nsfw: false
                        status: A
                        added: 3 weeks ago
                        by: Linda P.
                      total_count: 2
                      timestamp: '2026-10-16T10:04:39.652156+00:00'
                  summary: Page of insults
          description: A page of insults.
        '400':
          description: Unknown category key or name.
        '404':
          description: '`page` is past the last page (filters that match nothing return
            `200` with no results).'
        '500':
          description: Internal server error occurred
        '429':
          description: API rate limit exceeded
    post:
      operationId: create_insult
      description: Submit a new insult as the authenticated user. `category` takes
        a key or name. The insult starts as `Pending - New` and stays out of public
        listings until a moderator approves it; its owner can still retrieve it.
      summary: Create an insult
      tags:
      - Insults
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInsultRequest'
            examples:
              NewInsult:
                value:
                  content: Yo momma is so slow she got a speeding ticket in 2031.
                  category: F
                  nsfw: false
                summary: New insult
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateInsultRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateInsultRequest'
        required: true
      security:
      - TokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInsult'
              examples:
                CreatedInsult:
                  value:
                    reference_id: GIGGLE_Mw==
                    category: Fat
                    content: Yo momma is so slow she got a speeding ticket in 2031.
                    nsfw: false
                    status: Pending - New
                    added_by: Mike R.
                    added_on: just now
                  summary: Created insult
          description: The created insult.
        '400':
          description: Invalid or missing insult fields.
        '401':
          description: Authentication credentials required
        '500':
          description: Internal server error occurred
  /api/v2.0.0/insults/{reference_id}/:
    get:
      operationId: retrieve_insult
      description: One insult by reference ID. Active insults are public; an authenticated
        owner can also retrieve their own pending or rejected submissions. Anything
        else returns `404`.
      summary: Retrieve an insult
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        description: 'The insult''s public reference ID: a prefix (`GIGGLE`, `CHUCKLE`,
          `SNORT`, `SNICKER` or `CACKLE`), an underscore and an encoded number, e.g.
          `SNORT_MQ==`.'
        required: true
      tags:
      - Insults
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizedInsult'
              examples:
                MyInsultsListExample:
                  value:
                  - reference_id: GIGGLE_Nzk1
                    category: One-Off/Unique
                    content: Yo momma is so bald... you can see what''s on her mind.
                    status: Active
                    reports_count: 0
                  - reference_id: CACKLE_Xy12
                    category: Stupid
                    content: Yo momma so stupid, she went to the dentist to get Bluetooth.
                    status: Pending
                    reports_count: 2
                  summary: List of User's Insults
                  description: Shows a simplified list of insults created by the user
                Insult:
                  value:
                    content: Yo momma is so fat she needs two time zones.
                    reference_id: SNORT_MQ==
                    category: Fat
                    nsfw: false
                    status: A
                    added: 2 days ago
                    by: Mike R.
          description: The insult.
        '404':
          description: The requested insult could not be found
        '429':
          description: API rate limit exceeded
        '500':
          description: Internal server error occurred
    put:
      operationId: update_insult
      description: Replace an insult's editable fields. Only its owner may do this.
      summary: Replace an insult
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        description: 'The insult''s public reference ID: a prefix (`GIGGLE`, `CHUCKLE`,
          `SNORT`, `SNICKER` or `CACKLE`), an underscore and an encoded number, e.g.
          `SNORT_MQ==`.'
        required: true
      tags:
      - Insults
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizedInsultRequest'
            examples:
              CreateOrModifyAnInsultExample:
                value:
                  category: Poor
                  content: Your code is like a maze - confusing and full of dead ends
                  nsfw: false
                summary: Create New Insult
                description: Example request for creating a new insult
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OptimizedInsultRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OptimizedInsultRequest'
        required: true
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizedInsult'
              examples:
                MyInsultsListExample:
                  value:
                  - reference_id: GIGGLE_Nzk1
                    category: One-Off/Unique
                    content: Yo momma is so bald... you can see what''s on her mind.
                    status: Active
                    reports_count: 0
                  - reference_id: CACKLE_Xy12
                    category: Stupid
                    content: Yo momma so stupid, she went to the dentist to get Bluetooth.
                    status: Pending
                    reports_count: 2
                  summary: List of User's Insults
                  description: Shows a simplified list of insults created by the user
                Insult:
                  value:
                    content: Yo momma is so fat she needs two time zones.
                    reference_id: SNORT_MQ==
                    category: Fat
                    nsfw: false
                    status: A
                    added: 2 days ago
                    by: Mike R.
          description: The updated insult.
        '400':
          description: The request was malformed or invalid
        '401':
          description: Authentication credentials required
        '403':
          description: Resource access restricted to owner only
        '404':
          description: The requested insult could not be found
        '429':
          description: API rate limit exceeded
        '500':
          description: Internal server error occurred
    patch:
      operationId: partial_update_insult
      description: 'Update only the fields sent, e.g. `{"nsfw": true}`. Only the insult''s
        owner may do this.'
      summary: Update part of an insult
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        description: 'The insult''s public reference ID: a prefix (`GIGGLE`, `CHUCKLE`,
          `SNORT`, `SNICKER` or `CACKLE`), an underscore and an encoded number, e.g.
          `SNORT_MQ==`.'
        required: true
      tags:
      - Insults
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOptimizedInsultRequest'
            examples:
              CreateOrModifyAnInsultExample:
                value:
                  category: Poor
                  content: Your code is like a maze - confusing and full of dead ends
                  nsfw: false
                summary: Create New Insult
                description: Example request for creating a new insult
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOptimizedInsultRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOptimizedInsultRequest'
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizedInsult'
              examples:
                MyInsultsListExample:
                  value:
                  - reference_id: GIGGLE_Nzk1
                    category: One-Off/Unique
                    content: Yo momma is so bald... you can see what''s on her mind.
                    status: Active
                    reports_count: 0
                  - reference_id: CACKLE_Xy12
                    category: Stupid
                    content: Yo momma so stupid, she went to the dentist to get Bluetooth.
                    status: Pending
                    reports_count: 2
                  summary: List of User's Insults
                  description: Shows a simplified list of insults created by the user
                Insult:
                  value:
                    content: Yo momma is so fat she needs two time zones.
                    reference_id: SNORT_MQ==
                    category: Fat
                    nsfw: false
                    status: A
                    added: 2 days ago
                    by: Mike R.
          description: The updated insult.
        '400':
          description: The request was malformed or invalid
        '401':
          description: Authentication credentials required
        '403':
          description: Resource access restricted to owner only
        '404':
          description: The requested insult could not be found
        '429':
          description: API rate limit exceeded
        '500':
          description: Internal server error occurred
    delete:
      operationId: delete_insult
      description: Permanently delete an insult. Only its owner may do this.
      summary: Delete an insult
      parameters:
      - in: path
        name: reference_id
        schema:
          type: string
        description: 'The insult''s public reference ID: a prefix (`GIGGLE`, `CHUCKLE`,
          `SNORT`, `SNICKER` or `CACKLE`), an underscore and an encoded number, e.g.
          `SNORT_MQ==`.'
        required: true
      tags:
      - Insults
      security:
      - TokenAuth: []
      responses:
        '204':
          description: Deleted; no response body.
        '401':
          description: Authentication credentials required
        '403':
          description: Resource access restricted to owner only
        '404':
          description: The requested insult could not be found
        '429':
          description: API rate limit exceeded
        '500':
          description: Internal server error occurred
  /api/v2.0.0/insults/random/:
    get:
      operationId: get_random_insult
      description: 'One random active insult, optionally limited by `category` and
        `nsfw`. Never cached: every call can return a different insult. Not rate limited.'
      summary: Get a random insult
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category key (e.g. `P`) or name (e.g. `Poor`), case-insensitive.
          An unknown category returns `400`.
      - in: query
        name: nsfw
        schema:
          type: boolean
        description: 'Filter explicit content: `true` returns only NSFW insults, `false`
          only SFW ones. Omit it to include both.'
      tags:
      - Insults
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizedInsult'
              examples:
                MyInsultsListExample:
                  value:
                  - reference_id: GIGGLE_Nzk1
                    category: One-Off/Unique
                    content: Yo momma is so bald... you can see what''s on her mind.
                    status: Active
                    reports_count: 0
                  - reference_id: CACKLE_Xy12
                    category: Stupid
                    content: Yo momma so stupid, she went to the dentist to get Bluetooth.
                    status: Pending
                    reports_count: 2
                  summary: List of User's Insults
                  description: Shows a simplified list of insults created by the user
                Insult:
                  value:
                    content: Yo momma is so fat she needs two time zones.
                    reference_id: SNORT_MQ==
                    category: Fat
                    nsfw: false
                    status: A
                    added: 2 days ago
                    by: Mike R.
          description: A random insult.
        '400':
          description: Unknown category key or name.
        '401':
          description: Authentication credentials required
        '404':
          description: No resources found matching the provided criteria
        '500':
          description: Internal server error occurred
  /api/v2.0.0/insults/reference-ids/:
    get:
      operationId: list_reference_ids
      description: A page of the reference IDs of every active insult, sorted so paging
        is stable. Pass an ID to `GET /api/v2.0.0/insults/{reference_id}/` for the
        full insult. Not rate limited.
      summary: List active insult reference IDs
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Insults
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ReferenceIDs:
                  value:
                    count: 214
                    next: https://api.yo-momma.io/api/v2.0.0/insults/reference-ids/?page=2
                    previous: null
                    results:
                    - CACKLE_NDQ5
                    - CHUCKLE_NDUz
                    - GIGGLE_Mg==
                  summary: Reference IDs
          description: A page of reference IDs.
        '404':
          description: '`page` is past the last page (filters that match nothing return
            `200` with no results).'
        '500':
          description: Internal server error occurred
  /api/v2.0.0/reports/:
    post:
      operationId: report_joke
      description: |-
        Flag a joke for moderator review. A valid report opens a GitHub issue for the moderation team; the response links to it.

        `rationale_for_review` must be at least 70 characters. Reports can be anonymous; otherwise first and last name are required, and an email is required when `post_review_contact_desired` is true.
      summary: Report a joke for review
      tags:
      - Joke Reporting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsultReviewRequest'
            examples:
              AnonymousReport:
                value:
                  insult_reference_id: SNORT_MQ==
                  review_type: RE
                  anonymous: true
                  rationale_for_review: This joke is explicit and should be marked
                    NSFW so it does not show up in SFW results.
                summary: Anonymous report
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InsultReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InsultReviewRequest'
        required: true
      responses:
        '201':
          description: Report accepted and a GitHub issue opened.
        '400':
          description: Invalid report; `errors` lists the problems by field.
        '422':
          description: The report was valid but the GitHub issue couldn't be created
            (e.g. GitHub is unreachable). Retry later.
        '429':
          description: API rate limit exceeded
        '500':
          description: Internal server error occurred
  /auth/token/login/:
    post:
      operationId: auth_token_login
      description: 'Exchange a username and password for an API token. Send it as
        `Authorization: Token <token>` on requests that need an account.'
      summary: Log in and get a token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
