          x-spec-enum-id: 336774142b105a70
          readOnly: true
        added:
          type: string
          readOnly: true
        by:
          type: string
          readOnly: true
      required:
      - added
      - by
      - category
      - content
      - nsfw
      - reference_id
      - status
    OptimizedInsultRequest:
      type: object
      description: |-
