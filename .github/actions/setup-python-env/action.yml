---
name: 'Setup Python Environment'
description: 'Setup Python, uv, and virtual environment with caching'
inputs:
  python-version:
    description: 'Python version to use'
    required: true
  cache-suffix:
    description: 'Additional cache key suffix (unused, kept for back-compat)'
    required: false
    default: ''
  install-task:
    description: 'Whether to install Task CLI'
    required: false
    default: 'false'
  doppler-token:
    description: 'Doppler token for environment variables'
    required: false
  github-token:
    description: 'GitHub token for Task installation'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    # setup-uv's `python-version` input only sets UV_PYTHON as a preference —
    # it does not guarantee the interpreter is installed or selected, so pin
    # and install it explicitly through uv rather than relying on that input.
    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Create virtual environment and install dependencies
      shell: bash
      run: uv sync --python ${{ inputs.python-version }} --group test --group dev

    - name: Install Doppler CLI
      if: inputs.doppler-token != ''
      uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

    - name: Fetch environment variables
      if: inputs.doppler-token != ''
      uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
      with:
        doppler-token: ${{ inputs.doppler-token }}
        inject-env-vars: true

    - name: Install Task
      if: inputs.install-task == 'true'
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        version: 3.x
        repo-token: ${{ inputs.github-token }}
