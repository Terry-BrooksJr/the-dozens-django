name: CI Pipeline


on:
  push:
  pull_request:
    branches: [master, main, develop]

env:
  PYTHON_VERSION: '3.14'
  IMAGE_NAME: the-dozens

jobs:
  lint:
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-task: 'true'
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run linters
        run: task lint:fix

  test:
    runs-on: ubuntu-latest


    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db


        options: >-
          --health-cmd "pg_isready -U root -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-task: 'true'
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Doppler CLI
        if: github.actor != 'dependabot[bot]'
        run: |
          curl -Ls https://cli.doppler.com/install.sh | sudo sh
          doppler --version

      - name: Run tests with coverage
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
          # Force the Staging Django configuration (Postgres service container
          # above + in-memory LocMemCache). Set here rather than relying on
          # Taskfile's `env:` block: go-task does not override a variable that
          # already exists, and Doppler injects its own DJANGO_CONFIGURATION.
          # Preserve the workflow's local database and Django configuration.
          # A shared Redis let parallel CI runs' cache.clear() calls wipe each
          # other's session keys (django.contrib.sessions UpdateError).
          DJANGO_CONFIGURATION: Staging
          PG_DATABASE_HOST: localhost
          PG_DATABASE_PORT: '5432'
          PG_DATABASE_USER: root
          PG_DATABASE_PASSWORD: postgres
          POSTGRES_DB: test_db
        run: |
          if [[ "$GITHUB_ACTOR" == "dependabot[bot]" ]]; then
            export DOPPLER_TOKEN=
            export SECRET_KEY=ci-only-django-secret-key SITE_ID=1 CACHE_TTL=300
            export GITHUB_ACCESS_TOKEN=ci-unused
            export RECAPTCHA_PRIVATE_KEY=ci-unused RECAPTCHA_PUBLIC_KEY=ci-unused
            export S3_OBJECT_STORAGE_KEY=ci-unused S3_OBJECT_STORAGE_SECRET=ci-unused
            export S3_OBJECT_STORAGE_BUCKET_NAME=ci-unused S3_REGION_NAME=us-east-1
            export S3_ENDPOINT_URL=http://127.0.0.1:9000
            export EMAIL_SERVER=localhost EMAIL_TSL_PORT=2525
            export NOTIFICATION_SENDER_EMAIL=ci@example.invalid EMAIL_ACCT_PASSWORD=ci-unused
            export MAILER_EMPTY_QUEUE_SLEEP=1
            task test:coverage
            exit
          fi

          doppler run \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            --token "$DOPPLER_TOKEN" \
            --preserve-env \
            -- env -u DOPPLER_TOKEN task test:coverage

      - name: Upload coverage to Codacy
        if: github.actor != 'dependabot[bot]'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./cobertura.xml

  security-scan:
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Safety CLI to check for vulnerabilities
        continue-on-error: true
        uses: pyupio/safety-action@7baf6605473beffc874c1313ddf2db085c0cacf2 # v1
        with:
          api-key: ${{ secrets.SAFETY_API_KEY }}

      - name: Run Bandit Report
        run: |
          echo "Running static security analysis..."
          .venv/bin/bandit -r . -f json -o bandit-report.json || true

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-results
          path: bandit-report.json

  build-status:
    if: always()
    needs:
      - lint
      - test
      - security-scan

    runs-on: ubuntu-latest


    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.lint.result }}" == "success" &&
                "${{ needs.test.result }}" == "success" &&
                "${{ needs.security-scan.result }}" == "success" ]]; then

            echo "✅ All checks passed!"
            exit 0

          else

            echo "❌ Some checks failed:"
            echo "Lint: ${{ needs.lint.result }}"
            echo "Test: ${{ needs.test.result }}"
            echo "Security: ${{ needs.security-scan.result }}"
            exit 1

          fi

  docker:
    name: Build and Publish Docker Image
    needs:
      - build-status

    runs-on: ubuntu-latest
    concurrency:
      group: docker-image-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate Docker metadata
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Validate Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .deploy/Dockerfile
          call: check

      - name: Build Docker image for startup check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .deploy/Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/dozens-api.tar
          tags: dozens-api:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Load the OCI image for startup verification
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo copy "oci-archive:${RUNNER_TEMP}/dozens-api.tar" docker-daemon:dozens-api:ci

      - name: Verify the API image starts
        run: |
          docker run --detach --name dozens-api-smoke --network none \
            --env ALLOWED_HOSTS=localhost,127.0.0.1 \
            --env SECRET_KEY=ci-startup-test-only \
            --env SITE_ID=1 \
            --env CACHE_TTL=60 \
            --env USE_REDIS_CACHE=false \
            --env GITHUB_ACCESS_TOKEN=ci-placeholder \
            --env RECAPTCHA_PRIVATE_KEY=ci-placeholder \
            --env RECAPTCHA_PUBLIC_KEY=ci-placeholder \
            --env S3_OBJECT_STORAGE_KEY=ci-placeholder \
            --env S3_OBJECT_STORAGE_SECRET=ci-placeholder \
            --env S3_OBJECT_STORAGE_BUCKET_NAME=ci-placeholder \
            --env S3_ENDPOINT_URL=https://example.invalid \
            --env S3_REGION_NAME=us-east-1 \
            --env EMAIL_SERVER=localhost \
            --env EMAIL_TSL_PORT=587 \
            --env NOTIFICATION_SENDER_EMAIL=ci@example.invalid \
            --env EMAIL_ACCT_PASSWORD=ci-placeholder \
            --env MAILER_EMPTY_QUEUE_SLEEP=5 \
            dozens-api:ci
          trap 'docker rm -f dozens-api-smoke >/dev/null' EXIT

          for attempt in {1..30}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' dozens-api-smoke)" != true ]]; then
              break
            fi
            status="$(docker exec dozens-api-smoke curl --silent --output /dev/null \
              --write-out '%{http_code}' --max-time 2 http://127.0.0.1:9555/api/ping/ || true)"
            if [[ "$status" == 200 ]]; then
              exit 0
            fi
            sleep 2
          done

          docker logs dozens-api-smoke
          echo "::error::The Docker image did not serve HTTP 200 at /api/ping/"
          exit 1

      - name: Check that this commit is still the default-branch head
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: publish
        run: |
          remote_ref="$(git ls-remote --exit-code --refs origin "$GITHUB_REF")"
          read -r head_sha _ <<< "$remote_ref"
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping image publication because the default branch has advanced"
          fi

      - name: Login to Docker Hub
        if: steps.publish.outputs.current == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the verified OCI image
        if: steps.publish.outputs.current == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            skopeo copy --all --preserve-digests \
              "oci-archive:${RUNNER_TEMP}/dozens-api.tar" "docker://$tag"
          done <<< "$IMAGE_TAGS"
